[package]
name = "focustime"
version = "0.1.0"
description = "FocusTime - Windows focus/distraction tracker"
authors = ["you"]
edition = "2021"
default-run = "focustime"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "focustime_lib"
# Desktop-only for now (Phase 1); mobile targets would need "staticlib"/"cdylib" back.
crate-type = ["rlib"]

[features]
# This feature is used for production builds or when a dev server is not
# specified, DO NOT REMOVE!! Without it, plain `cargo build` (not run through
# `tauri dev`/`tauri build`) always points the webview at `devUrl` instead of
# the bundled `frontendDist`, regardless of --release.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.32"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
